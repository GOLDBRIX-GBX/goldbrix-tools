<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c1610">
<title>Burns · GoldBrix</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#1c1610;--card:#2a2218;--card2:#241d13;--line:#3a3025;--gold:#FFD98A;--ink:#FFFDF7;--green:#57FF9E;--red:#FF6B5C;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:'Courier New',ui-monospace,monospace;padding:14px 12px 90px;}
.sect{color:#FFFDF7;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;}
.hero{border-color:var(--red);text-align:center}
.hero .hk{font-size:.72rem;letter-spacing:.14em;color:#FFFDF7;text-transform:uppercase}
.hero .hv{font-size:1.9rem;font-weight:800;color:var(--red);margin:6px 0 2px;font-variant-numeric:tabular-nums;word-break:break-word}
.hero .hs{font-size:.74rem;color:#FFFDF7}
.frozen{border-style:dashed;text-align:center}
.frozen .hv{font-size:1.15rem;font-weight:800;color:#FFFDF7;margin:4px 0 2px}
.frozen .hk,.frozen .hs{font-size:.7rem;color:#FFFDF7;letter-spacing:.08em}
.row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card2);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.op{min-width:52px;text-align:center;font-weight:800;font-size:.72rem;letter-spacing:.05em}
.opP{color:var(--green)}.opQ{color:var(--red)}.opB{color:var(--green)}.opS{color:var(--red)}.opC{color:var(--gold)}.opG{color:var(--gold)}.opR{color:var(--gold)}
.main{flex:1;min-width:0}
.m1{font-weight:700;font-size:.84rem}
.m1 a{color:var(--gold);text-decoration:underline dotted}
.m2{font-size:.7rem;color:#FFFDF7;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{text-align:right;white-space:nowrap}
.v1{font-weight:800;font-size:.86rem;color:var(--red);font-variant-numeric:tabular-nums}
.v2{font-size:.64rem;color:#FFFDF7;margin-top:2px}
.empty{padding:22px;text-align:center;color:#FFFDF7}
.scan{text-align:center;font-size:.7rem;color:#FFFDF7;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom));z-index:50}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;text-decoration:none;color:#FFFDF7;font-size:9px;font-weight:700;letter-spacing:.1em;opacity:.92}
.nav a.on{color:var(--gold);opacity:1}
.nav span.ic{font-size:18px}
</style>
<script src="/i18n.js?v=115" defer></script>
<script src="/v3/gbx-read.js?v=119" defer></script>
<script src="/v3/nav-i18n.js?v=115" defer></script>
</head>
<body>
<div class="sect" id="pgTitle">Burns</div>

<div class="card hero">
  <div class="hk" id="hTot">Total burned on-chain · forever</div>
  <div class="hv" id="totV">—</div>
  <div class="hs" id="totS">—</div>
</div>

<div class="card frozen">
  <div class="hk" id="fTit">Includes the custodial era and every launchpad burn</div>
</div>

<div class="sect" id="listTitle">Every burn · first to last</div>
<div id="list"><div class="empty" id="loadMsg">Loading…</div></div>
<div class="scan" id="scanNote"></div>

<nav class="nav">
  <a href="/"><span class="ic">🏠</span><span data-t="navHome">HOME</span></a>
  <a href="/v3/wallet.html"><span class="ic">👤</span><span data-t="navWallet">WALLET</span></a>
  <a href="/v3/trade.html"><span class="ic">📊</span><span data-t="navTrade">TRADE</span></a>
  <a href="/v3/launch.html"><span class="ic">🚀</span><span data-t="navLaunch">LAUNCH</span></a>
  <a class="on" href="/v3/leaderboard.html"><span class="ic">🔥</span><span data-t="navBurns">BURNS</span></a>
  <a href="/v3/explorer.html"><span class="ic">🔍</span><span data-t="navExplorer">EXPLORER</span></a>
  <a href="/v3/settings.html"><span class="ic">⚙️</span><span data-t="navSettings">SETTINGS</span></a>
</nav>

<script>
(function(){
var L='en';try{L=(localStorage.getItem('gbx_lang')||localStorage.getItem('goldbrix_lang')||'en').slice(0,2);}catch(e){}
if(L==='ar'){try{document.documentElement.dir='rtl';}catch(e){}}
var T={
en:{title:'Burns',tot:'Total burned on-chain · forever',meas:'measured by this node from the chain',froz:'Includes the custodial era (34,694.09 GBX · 207 tx · closed) and every launchpad burn',fsub:'',list:'Launchpad burns · first to last',loading:'Loading…',nodata:'No burns yet',blk:'block',fees:{C:'CREATE fee',B:'curve fee 0.5%',S:'curve fee 0.5%',P:'pool fee 0.3%',Q:'pool fee 0.3%',G:'graduation',R:'refund'},scanned:'chain scanned to block'},
ro:{title:'Arderi',tot:'Total ars on-chain · pentru totdeauna',meas:'măsurat de acest nod din lanț',froz:'Include era custodială (34.694,09 GBX · 207 tx · închisă) și fiecare ardere din launchpad',fsub:'',list:'Arderi launchpad · de la prima la ultima',loading:'Se încarcă…',nodata:'Nicio ardere încă',blk:'bloc',fees:{C:'fee CREARE',B:'fee curbă 0,5%',S:'fee curbă 0,5%',P:'fee pool 0,3%',Q:'fee pool 0,3%',G:'graduare',R:'refund'},scanned:'lanț scanat până la blocul'},
de:{title:'Verbrennungen',tot:'Insgesamt on-chain verbrannt · für immer',meas:'von diesem Node aus der Chain gemessen',froz:'Enthält die Custodial-Ära (34.694,09 GBX · 207 Tx · geschlossen) und jeden Launchpad-Burn',fsub:'',list:'Launchpad-Burns · von zuerst bis zuletzt',loading:'Lädt…',nodata:'Noch keine Burns',blk:'Block',fees:{C:'CREATE-Gebühr',B:'Kurven-Gebühr 0,5%',S:'Kurven-Gebühr 0,5%',P:'Pool-Gebühr 0,3%',Q:'Pool-Gebühr 0,3%',G:'Graduierung',R:'Erstattung'},scanned:'Chain gelesen bis Block'},
zh:{title:'销毁',tot:'链上总销毁 · 永久',meas:'由本节点从链上测量',froz:'包含托管时代（34,694.09 GBX · 207 笔 · 已关闭）及所有 launchpad 销毁',fsub:'',list:'Launchpad 销毁 · 从第一笔到最后一笔',loading:'加载中…',nodata:'暂无销毁',blk:'区块',fees:{C:'创建费',B:'曲线费 0.5%',S:'曲线费 0.5%',P:'池费 0.3%',Q:'池费 0.3%',G:'毕业',R:'退款'},scanned:'链已扫描至区块'},
ar:{title:'الحرق',tot:'إجمالي المحروق على السلسلة · للأبد',meas:'مقاس بواسطة هذه العقدة من السلسلة',froz:'يشمل الحقبة الوصائية (34,694.09 GBX · 207 معاملة · مغلقة) وكل حرق launchpad',fsub:'',list:'حرق launchpad · من الأول إلى الأخير',loading:'جارٍ التحميل…',nodata:'لا حرق بعد',blk:'كتلة',fees:{C:'رسوم الإنشاء',B:'رسوم المنحنى 0.5%',S:'رسوم المنحنى 0.5%',P:'رسوم المجمع 0.3%',Q:'رسوم المجمع 0.3%',G:'التخرج',R:'استرداد'},scanned:'تم مسح السلسلة حتى الكتلة'}};
var t=T[L]||T.en;
function $(i){return document.getElementById(i);}
[['pgTitle',t.title],['hTot',t.tot],['fTit',t.froz],['listTitle',t.list],['loadMsg',t.loading]].forEach(function(x){var e=$(x[0]);if(e)e.textContent=x[1];});

function gbxFull(sat){var n=Number(sat)/1e8;
  return n.toLocaleString('en-US',{minimumFractionDigits:n<1?4:2,maximumFractionDigits:n<1?8:2});}
async function gj(p){for(var i=0;i<20&&!window.GBXRead;i++)await new Promise(function(r){setTimeout(r,100);});
  return window.GBXRead?await window.GBXRead.json(p):await (await fetch(p)).json();}

async function load(){
  try{
    var j=await gj('/api/burns');
    if(!j)return;
    var tot=j.chain_total_sat||j.launchpad_burn_sat;
    $('totV').textContent=gbxFull(tot)+' GBX';
    $('totS').textContent=(j.chain_burn_utxos?j.chain_burn_utxos+' UTXO · ':'')+t.meas;
    var el=$('list');
    var bs=(j.burns||[]);
    if(!bs.length){el.innerHTML='<div class="empty">'+t.nodata+'</div>';return;}
    var html=bs.map(function(b){
      return '<div class="row">'+
        '<div class="op op'+b.op+'">'+b.op+'</div>'+
        '<div class="main"><div class="m1"><a href="/v3/coin-x.html?coin='+b.coin_id+'">$'+(b.ticker||'?')+'</a> · '+(t.fees[b.op]||'')+'</div>'+
        '<div class="m2">'+t.blk+' '+b.height.toLocaleString('en-US')+' · '+b.txid.slice(0,10)+'…</div></div>'+
        '<div class="val"><div class="v1">-'+gbxFull(b.burn_sat)+'</div><div class="v2">GBX 🔥</div></div>'+
      '</div>';
    }).join('');
    if(el.innerHTML!==html)el.innerHTML=html; /* silent update */
    if(j.scanned)$('scanNote').textContent=t.scanned+' '+Number(j.scanned).toLocaleString('en-US');
  }catch(e){}
}
window.addEventListener('pageshow',function(e){if(e.persisted)location.reload();});
load();setInterval(load,30000);
})();
</script>
</body>
</html>
