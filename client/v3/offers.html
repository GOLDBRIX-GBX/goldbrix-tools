<style>
html,body{overflow-x:hidden;max-width:100%}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 90px}
.hero{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.hero h1{font-size:1.15rem;color:var(--gold);margin:0}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;text-align:center;padding:10px;border:1px solid var(--border);border-radius:12px;color:var(--text-primary);cursor:pointer;font-weight:600}
.tab.on{border-color:var(--gold);color:var(--gold)}
.card{background:var(--panel,rgba(255,255,255,.03));border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:8px;margin:6px 0;font-size:.85rem}
.lab{color:#FFFDF7;opacity:1;font-size:.8rem}
.val{font-family:'JetBrains Mono',monospace;color:var(--text-primary)}
.price{color:var(--gold);font-weight:700}
.amt{color:var(--green)}
input,select{width:100%;background:#141414;border:1px solid var(--border);border-radius:10px;color:var(--text-primary);padding:12px;font-size:.95rem;font-family:'JetBrains Mono',monospace;margin:4px 0 10px}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:var(--gold);color:#221a08;font-weight:700;font-size:1rem;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-primary)}
.btn.red{background:var(--red);color:#2a0d08}
.btn:disabled{opacity:.55}
.msg{display:none;border-radius:10px;padding:10px;margin:8px 0;font-size:.85rem;overflow-wrap:anywhere;word-break:break-word}
.msgLocal{margin:8px 0 0}
.msg.ok{display:block;background:rgba(87,255,158,.12);color:var(--green)}
.msg.err{display:block;background:rgba(255,107,92,.12);color:var(--red)}
.msg.info{display:block;background:rgba(255,217,138,.10);color:var(--gold)}
.empty{color:#FFFDF7;opacity:1;text-align:center;padding:18px;font-size:.85rem}
.mine{border-color:rgba(255,217,138,.45)}
.chainB{color:#7fb3ff}.chainA{color:#8fd4ff}.chainS{color:#c8f7c5}
</style>
</head>

// Node and RPC errors are for the console, not for a person: the screen says
// what happened in plain words, the raw text stays available for diagnosis.
function humanMsg(t){
  const raw=String(t==null?'':t); const low=raw.toLowerCase();
  const M={E_TXFAIL:'eTxFail',E_NONODE:'eNode',E_MODULE:'eNet',E_ADDR:'badAddr',E_AMOUNT:'badAmt',E_TIP:'eNet',
           E_NOREC:'eNoRec',E_NOPRE:'eNoPre',E_NOLOCK:'eNoLock',E_SCRIPT:'eScript',
           E_SOLDOWN:'eChain',E_HASHLOCK:'eGen',E_BUYERPK:'eGen',E_TIMELOCK:'eShortWin'};
  for(const k in M) if(raw.indexOf(k)>=0) return tt(M[k]);
  if(low.indexOf('missingorspent')>=0||low.indexOf('-25')>=0) return tt('eBusy');
  if(low.indexOf('insufficient fee')>=0||low.indexOf('replacement')>=0||low.indexOf('-26')>=0) return tt('eDone');
  if(low.indexOf('tx-size')>=0||low.indexOf('too big')>=0) return tt('eSize');
  if(low.indexOf('insufficient funds')>=0||low.indexOf('exceeds balance')>=0) return tt('eFunds');
  if(low.indexOf('fetch')>=0||low.indexOf('network')>=0||low.indexOf('rpc')>=0||low.indexOf('timeout')>=0) return tt('eNet');
  if(low.length>90) return tt('eGen');
  return raw;
}
// One press, one transaction. A button that is working says so and refuses to
// start a second copy of the same job - three taps must never mean three locks.
// A broadcast hash is not a result. Until the receipt says 0x1 the transaction
// may have reverted, and telling a person "done" over a failed claim is how they
// end up paying gas again and again for nothing.
function okTx(r){
  if(!r) throw new Error('E_TXFAIL');
  const st=(r.receipt&&r.receipt.status)!=null?r.receipt.status:null;
  if(st!=null && String(st)!=='0x1' && String(st)!=='1') throw new Error('E_TXFAIL');
  return r.hash;
}
function guard(fn){
  return async function(ev){
    const b=ev&&ev.target; 
    if(b&&b.disabled) return;
    _actBtn = (b && b.tagName==='BUTTON') ? b : null;
    clearLocalMsgs();
    let label=null;
    if(b){ label=b.textContent; b.disabled=true; b.textContent=tt('working2'); }
    try{ await fn.call(this,ev); }
    finally{ if(b){ b.disabled=false; if(label!=null) b.textContent=label; } }
  };
}
// The answer belongs next to the question: whatever a person just pressed is

function localMsgFor(btn){

    m=document.createElement('div'); m.className='msg msgLocal';

  const m=local ? localMsgFor(_actBtn) : $(el);

  if(kind==='err'){ try{console.log('[gbx:offers]',txt);}catch(_e){} m.textContent=humanMsg(txt); }

async function publish(rawtx){
  const nodes=(window.GBX_NODES||[]).slice();
  if(!nodes.length)throw new Error('E_NONODE');
  let reason=null;
  for(const n of nodes){
    let r,body;
    try{r=await fetch(String(n).replace(/\/+$/,'')+'/broadcast',{method:'POST',cache:'no-store',headers:{'content-type':'application/json'},body:JSON.stringify({rawtx})});body=await r.json().catch(()=>null);}catch(e){continue;}
    const id=body&&(body.txid||body.tx_hash);
    if(id){try{if(window.GoldbrixCrypto&&window.GoldbrixCrypto.spent)window.GoldbrixCrypto.spent.mark(rawtx);}catch(_e){}return id;}
    const msg=body&&(body.error||body.message);
    if(msg){reason=String(msg).replace(/\s+/g,' ').trim();break;}
  }
  throw new Error(reason||'no node accepted it');
}

function validAddr(chain,a){
  a=(a||'').trim();
  if(chain==='S')return /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a);
  return /^0x[0-9a-fA-F]{40}$/.test(a);
}
function addrBytes(chain,a){
  if(chain!=='S')return C.unhex(a.trim().replace(/^0x/,''));
  const A='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  let n=0n;for(const c of a.trim())n=n*58n+BigInt(A.indexOf(c));
  let b=[];while(n>0n){b.unshift(Number(n&255n));n>>=8n;}
  for(const c of a.trim()){if(c==='1')b.unshift(0);else break;}
  const u=new Uint8Array(b);
  if(u.length!==32)throw new Error('E_ADDR');
  return u;
}

// no gateway of any kind - the same contract the swap path uses, only without an
// intermediary. The buyer pays their own fee and the account rent, and the rent
// comes back at claim or refund. The seller's token account is created in the
// same transaction, because claim on chain requires it to exist already.

function solAddrFrom(v){

  }

}

    // The answer belongs next to the question: say it while the button that
    // asked is still on screen, and only then take the finished card away.
    say('msg','ok',tt('execOk')+' '+txid);
    try{ const c0=document.querySelector('.card.mine[data-tx="'+it.offer.txid+'"]'); if(c0) c0.remove(); }catch(_e){}
    refreshAll(); setTimeout(refreshAll,6000); setTimeout(refreshAll,20000);
  }catch(e){ say('msg','err',(e&&e.message||e)); }
}
// Once the buyer takes the GBX, S is public in the witness: the seller reads it
// from the chain and claims the USDC. No server, no counterparty cooperation.
// A button that cannot succeed is not offered: the USDC lock is read on its own
// chain, and only a lock that still holds the money shows "claim".
async function showIfClaimable(btn){
  try{
    const c=CH[btn.dataset.chain]; if(!c) return;
    // The node already read the chain for this lock, on every chain it serves.
    // A settled execution is history: no button, no scan, nothing asked of any
    // endpoint. Only an open one is still worth proving against the chain.
    if(btn.dataset.settled){
      btn.style.display='none';
      try{ const cd=btn.closest('.card'); const lb=cd&&cd.querySelector('.lExec');
        if(lb) lb.textContent=tt('execDone'); }catch(_e){}
      return;
    }
    // Solana keeps the settlement state inside the swap account itself, and the
    // account address derives from the hashlock: one cheap read answers whether
    // this money is still there to be taken.
    if(btn.dataset.chain==='S'){
      const MS=await import('/mod-b-solana.mjs');
      const st=await MS.fetchSolSwapByHashlock(c.program,String(btn.dataset.hl||'').replace(/^0x/,''));
      const live = !!(st && !st.claimed && !st.refunded);
      btn.style.display = live ? '' : 'none';
      try{ const cd=btn.closest('.card'); const lb=cd&&cd.querySelector('.lExec');
        if(lb) lb.textContent = live ? tt('inExec') : tt('execDone'); }catch(_e){}
      return;
    }
    if(!c.htlc) return;
    const OE=await import('/gbx-offer-exec.mjs');
    const rpc=evmRpcFor(c);
    const hl='0x'+String(btn.dataset.hl||'').replace(/^0x/,'');
    const locks=await OE.evmFindLocksForReceiver({rpc,htlcAddr:c.htlc,receiverHex20:btn.dataset.addr,scanBack:(c&&c.scan)||100000,win:9000});
    const L=locks.find(x=>String(x.hashlock).toLowerCase()===hl.toLowerCase());
    if(!L){ btn.style.display='none'; return; }
    // One judgement for "is this money still there", shared with every other
    // caller: Claimed AND Refunded both close a lock. A button that cannot
    // succeed is never offered.
    let done=true;
    try{ done=await OE.evmLockSettled({rpc,htlcAddr:c.htlc,lockId:L.id,fromBlock:L.blockNumber}); }catch(_e){ return; }
    btn.style.display = done ? 'none' : '';
    // The label tells the same truth as the button: a settled execution is
    // history, not a pending step. Both come from the one chain read above.
    try{ const cd=btn.closest('.card'); const lb=cd&&cd.querySelector('.lExec');
      if(lb) lb.textContent = done ? tt('execDone') : tt('inExec'); }catch(_e){}
  }catch(_e){}
}
async function onClaimUsdc(ev){
  const hl=ev.target.dataset.hl;
  hideM('msg');
  try{
    say('msg','info',tt('claiming'));
    // Nothing here comes from this device: the secret became public the moment the
    // buyer took the GBX (it sits in the spending witness and every node indexes
    // it), and the USDC lock is found on its own chain by this wallet's address.
    // A seller can settle from any device, with only the wallet unlocked.
    const hlHex=String(hl||'').replace(/^0x/,'');
    const idx=await window.GBXRead.json('/api/htlc-by-hashlock/'+hlHex);
    const row=((idx&&idx.locks)||[]).find(x=>x.preimage);
    const S=row&&row.preimage;
    if(!S) throw new Error('E_NOPRE');
    if(ev.target.dataset.chain==='S'){ const sg=await solClaimUsdcFor(hlHex,ev.target.dataset.addr); try{ev.target.style.display='none';}catch(_x){} say('msg','ok',tt('claimOk')+' '+sg); refreshAll(); setTimeout(refreshAll,6000); return; }
    const c=CH[ev.target.dataset.chain]; if(!c) throw new Error('E_NOLOCK');
    const rpc=evmRpcFor(c);
    const OE=await import('/gbx-offer-exec.mjs');
    const locks=await OE.evmFindLocksForReceiver({rpc,htlcAddr:c.htlc,receiverHex20:ev.target.dataset.addr,scanBack:(c&&c.scan)||100000,win:9000});
    // The same hashlock can appear on more than one lock (a retried purchase, an
    // abandoned attempt). Only one of them still holds money: claiming any other
    // reverts and costs the seller gas for nothing.
    let L=null;
    for(const x of locks){
      if(String(x.hashlock).replace(/^0x/,'').toLowerCase()!==hlHex.toLowerCase()) continue;
      if(await OE.evmLockSettled({rpc,htlcAddr:c.htlc,lockId:x.id,fromBlock:x.blockNumber})) continue;
      L=x; break;
    }
    if(!L) throw new Error('E_NOLOCK');
    const {makeEVMHTLC}=await import('/evm-htlc.mjs');
    const {createEVM}=await import('/evm-tx-core.mjs');
    const {secp256k1, keccak_256}=await import('/vendor/evm-secp.mjs');
    const sign=(h,pv)=>{const sg=secp256k1.sign(h,pv,{lowS:true});const cc=sg.toCompactRawBytes();return {r:cc.slice(0,32),s:cc.slice(32,64),recovery:sg.recovery};};
    const evm=createEVM({keccak256:keccak_256,sign,getPublicKey:pv=>secp256k1.getPublicKey(pv,false)});
    const H=makeEVMHTLC({rpc,evm,chainId:c.chainId});
    const ev0=await window.GoldbrixMultichain.deriveEVM(wallet.mnemonic);
    const r=await H.claim(ev0.privateKey,c.htlc,L.id,'0x'+S); okTx(r);
    // Money already taken: the button that did it must not invite a second,
    // reverting attempt. It goes now, and the chain is re-read right after.
    try{ev.target.style.display='none';}catch(_x){}
    say('msg','ok',tt('claimOk')+' '+r.hash);
    refreshAll(); setTimeout(refreshAll,6000);
  }catch(e){ say('msg','err',(e&&e.message||e)); }
}
// ---- BUYER side: the GBX is in an HTLC only the preimage can open. The script
// is rebuilt from H (this device), both pubkeys and the timelock, then proven
// against the real p2wsh recorded on chain before anything is signed.
async function renderBuyPend(){
  const el=$('buyPend'); if(!el) return;
  const keysLS=Object.keys(localStorage).filter(k=>k.indexOf('gbx_offer_buy_')===0);
  let html='';
  for(const k of keysLS){
    let rec; try{ rec=JSON.parse(localStorage.getItem(k)); }catch(_e){ continue; }
    if(!rec||rec.owner_pk!==pkHex) continue;
    // the chain decides whether this still needs the user: a spent lock is done
    try{
      const st=await window.GBXRead.json('/api/htlc-by-hashlock/'+String(rec.hashlock).replace(/^0x/,''));
      const ls=(st&&st.locks)||[];
      if(ls.length && ls.every(x=>x.spent_height!=null)){ localStorage.removeItem(k); continue; }
    }catch(_e){}
    // Has the seller moved the GBX yet? The chain answers, and the card only
    // offers what is actually possible right now. If the seller never executes
    // (or cancels the offer), the money is not stuck: it comes back at timeout,
    // and until then the buyer sees exactly how long that is.
    let ready=false;
    try{
      const st=await window.GBXRead.json('/api/htlc-by-hashlock/'+String(rec.hashlock).replace(/^0x/,''));
      ready=(((st&&st.locks)||[]).some(x=>x.spent_height==null));
    }catch(_e){}
    const left=Number(rec.timelock||0)-Math.floor(Date.now()/1000);
    const hh=Math.floor(Math.max(0,left)/3600), mm=Math.floor((Math.max(0,left)%3600)/60);
    const state = ready ? tt('inExec') : (left>0 ? tt('waitSeller') : tt('canRefund'));
    html+='<div class="card" data-hl="'+rec.hashlock+'">'
      +'<div class="row"><span class="val amt">'+(Number(rec.gbx_sat)/1e8).toFixed(4)+' GBX</span><span class="val price">'+(Number(rec.usdc)/1e6).toFixed(4)+' USDC</span></div>'
      +'<div class="row"><span class="lab">'+CH[rec.chain].name+'</span><span class="lab">'+state+'</span></div>'
      +(ready?'<button class="btn btnClaimG" data-hl="'+rec.hashlock+'">'+tt('claimGbx')+'</button>':'')
      +(!ready&&left>0?'<div class="lab" style="margin-top:6px">'+tt('refundIn')+' '+hh+'h '+mm+'m</div>':'')
      +(!ready&&left<=0?'<button class="btn red btnRefundU" data-hl="'+rec.hashlock+'" data-chain="'+rec.chain+'">'+tt('refundBtn')+'</button>':'')
      +'</div>';
  }
  // Paint what is already known before scanning for anything else. The cards
  // above are complete: local memory plus the chain's own verdict. Making them
  // wait for a wide multi-chain scan means a phone often never shows them at
  // all - the money is there, the screen is empty. Draw first, recover after.
  paint(html);

  // Local memory is a convenience, never the source of truth: the chain lists
  // every lock this wallet still owns. Refund needs no secret, so a wiped
  // device (or any other device) can still take the money back.
  try{
    const OE=await import('/gbx-offer-exec.mjs');
    const now2=Math.floor(Date.now()/1000);
    const have=new Set(keysLS.map(k=>String(k.slice('gbx_offer_buy_'.length)).replace(/^0x/,'').toLowerCase()));
    for(const ch of ['B','A']){
    const c=CH[ch]; const me=myAddr[ch];
    if(!c||!c.htlc||!me) continue;
      const rpc=evmRpcFor(c);
      let mine=[]; try{ mine=await OE.evmFindLocksBySender({rpc,htlcAddr:c.htlc,senderHex20:me,scanBack:c.scan||100000,win:9000}); }catch(_e){ continue; }
      for(const L2 of mine){
        const hlx=String(L2.hashlock).replace(/^0x/,'').toLowerCase();
        if(have.has(hlx)) continue;
      if(Number(L2.timelock)>now2) continue;
        let done=true; try{ done=await OE.evmLockSettled({rpc,htlcAddr:c.htlc,lockId:L2.id,fromBlock:L2.blockNumber}); }catch(_e){ continue; }
      if(done) continue;
        html+='<div class="card" data-hl="'+hlx+'">'
          +'<div class="row"><span class="val price">'+(Number(L2.amount)/1e6).toFixed(4)+' USDC</span><span class="lab">'+c.name+'</span></div>'
          +'<div class="row"><span class="lab">'+tt('canRefund')+'</span></div>'
          +'<button class="btn red btnRefundU" data-hl="'+hlx+'" data-chain="'+ch+'" data-lockid="'+L2.id+'">'+tt('refundBtn')+'</button>'
          +'</div>';
      }
    }

    // Solana keeps no log a browser can search, so the federation answers for
    // the buyer the same way it already answers for the seller: by address.
    // Without this, a wallet that lost its local memory could not see its own
    // money, even though the account is alive on chain and belongs to it.
    try{
      const sol=await window.GoldbrixMultichain.deriveSOL(wallet.mnemonic);
      const me58=sol&&(sol.address||sol.publicKey);
      if(me58){
        const j=await window.GBXRead.json('/api/sol-locks-by-sender/'+me58);
        for(const L3 of ((j&&j.locks)||[])){
          const hlx=String(L3.hashlock).replace(/^0x/,'').toLowerCase();
          if(have.has(hlx)) continue;
          if(Number(L3.timelock)>now2) continue;
          html+='<div class="card" data-hl="'+hlx+'">'
            +'<div class="row"><span class="val price">'+(Number(L3.amount)/1e6).toFixed(4)+' USDC</span><span class="lab">'+CH.S.name+'</span></div>'
            +'<div class="row"><span class="lab">'+tt('canRefund')+'</span></div>'
            +'<button class="btn red btnRefundU" data-hl="'+hlx+'" data-chain="S">'+tt('refundBtn')+'</button>'
            +'</div>';
        }
      }
    }catch(_e){}
  }catch(_e){}
  paint(html);
  function paint(h){
    if(el.dataset.h===h) return;
    el.innerHTML=h; el.dataset.h=h;
    el.querySelectorAll('.btnClaimG').forEach(b=>b.addEventListener('click',guard(onClaimGbx)));
    el.querySelectorAll('.btnRefundU').forEach(b=>b.addEventListener('click',guard(onRefundUsdc)));
  }
}
// The buyer's way out, with nobody's permission: after the timeout the contract
// returns the USDC to whoever locked it. No seller, no node, no server involved.
async function onRefundUsdc(ev){
  const hl=ev.target.dataset.hl;
  hideM('msg');
  try{
    const rec=JSON.parse(localStorage.getItem('gbx_offer_buy_'+hl)||'null');
    const lidChain=ev.target.dataset.lockid||'';
    if(!rec && !lidChain) throw new Error('E_NOREC');
    if(ev.target.dataset.chain==='S'){
      const MS=await import('/mod-b-solana.mjs');
      const sol=await window.GoldbrixMultichain.deriveSOL(wallet.mnemonic);
      const kp=MS.solKeypairFromDerive(sol);
      const rr=await MS.refundUsdcSolana({gatewayBase:'',program:CH.S.program,mint:CH.S.usdc,solKeypair:kp,swapId:String(hl).replace(/^0x/,'')});
      if(!rr||!rr.sig) throw new Error('E_TXFAIL');
      try{ localStorage.removeItem('gbx_offer_buy_'+hl); }catch(_e){}
      say('msg','ok',tt('claimOk')+' '+rr.sig); refreshAll(); return;
    }
    const c=CH[ev.target.dataset.chain]; if(!c||!c.htlc) throw new Error('E_NOLOCK');
    say('msg','info',tt('claiming'));
    const rpc=evmRpcFor(c);
    const OE=await import('/gbx-offer-exec.mjs');
    const ev0=await window.GoldbrixMultichain.deriveEVM(wallet.mnemonic);
    const hlHex=String(hl).replace(/^0x/,'');
    let L=null;
    if(lidChain){ L={id:lidChain}; }
    else {
      const locks=await OE.evmFindLocksForReceiver({rpc,htlcAddr:c.htlc,receiverHex20:rec.seller_addr||'',scanBack:(c&&c.scan)||100000,win:9000});
      L=locks.find(x=>String(x.hashlock).replace(/^0x/,'').toLowerCase()===hlHex.toLowerCase());
      if(!L && rec.lock_id) L={id:rec.lock_id};
    }
    if(!L) throw new Error('E_NOLOCK');
    const {makeEVMHTLC}=await import('/evm-htlc.mjs');
    const {createEVM}=await import('/evm-tx-core.mjs');
    const {secp256k1, keccak_256}=await import('/vendor/evm-secp.mjs');
    const sign=(h,pv)=>{const sg=secp256k1.sign(h,pv,{lowS:true});const cc=sg.toCompactRawBytes();return {r:cc.slice(0,32),s:cc.slice(32,64),recovery:sg.recovery};};
    const evm=createEVM({keccak256:keccak_256,sign,getPublicKey:pv=>secp256k1.getPublicKey(pv,false)});
    const H=makeEVMHTLC({rpc,evm,chainId:c.chainId});
    const r=await H.refund(ev0.privateKey,c.htlc,L.id); okTx(r);
    try{ localStorage.removeItem('gbx_offer_buy_'+hl); }catch(_e){}
    say('msg','ok',tt('claimOk')+' '+r.hash);
    refreshAll(); setTimeout(refreshAll,6000); setTimeout(refreshAll,20000);
  }catch(e){ say('msg','err',(e&&e.message||e)); }
}
async function onClaimGbx(ev){
  const hl=ev.target.dataset.hl;
  hideM('msg');
  try{
    const rec=JSON.parse(localStorage.getItem('gbx_offer_buy_'+hl)||'null');
    if(!rec) throw new Error('E_NOREC');
    say('msg','info',tt('claiming'));
    const H=await import('/gbx-htlc.mjs');
    const hlHex=String(hl).replace(/^0x/,'');
    // the offer tells us the seller's key; the chain tells us which lock is ours
    const idx=await window.GBXRead.json('/api/htlc-by-hashlock/'+hlHex);
    const lock=((idx&&idx.locks)||[]).find(x=>x.spent_height==null);
    if(!lock) throw new Error('E_NOLOCK');
    const pkBuy=new Uint8Array(keys.publicKey), pkSell=C.unhex(lock.refund_pk);
    const Hb=C.unhex(hlHex);
    // T2 is derived from the buyer's own USDC lock, exactly as the seller
    // derived it: (timelock - execution time - margin) / block time. The old
    // convention (+100000) is still tried so locks made before this rule stay
    // claimable. The script is always proven against the real p2wsh, never guessed.
    let script=null;
    const h0=Number(lock.height);
    const derived=h0+Math.floor((Number(rec.timelock)-Math.floor(Date.now()/1000)-T_MARGIN_SEC)/3);
    const centres=[derived, h0+14400, h0+100000];
    for(const c0 of centres){
      for(let t=c0-3000; t<=c0+3000; t++){
        const cand=H.buildHtlcScript(Hb,pkBuy,pkSell,t);
        if(H.hex(H.p2wshSpk(cand)).toLowerCase()===String(lock.spk).toLowerCase()){ script=cand; break; }
      }
      if(script) break;
    }
    if(!script) throw new Error('E_SCRIPT');
    const derSig=c=>{const tr=x=>{let i=0;while(i<31&&x[i]===0)i++;let v=x.subarray(i);if(v[0]&0x80)v=Uint8Array.of(0,...v);return v;};const r=tr(c.subarray(0,32)),s=tr(c.subarray(32,64));return Uint8Array.of(0x30,4+r.length+s.length,0x02,r.length,...r,0x02,s.length,...s);};
    const val=Number(lock.value_sat);
    const txhex=H.hex(H.buildClaimTx({prevTxid:lock.txid,vout:lock.vout,inValue8:val,htlcScript:script,
      outScriptPubKey:spkU,outValue8:val-10000,nLockTime:0,preimage:C.unhex(rec.secret)},
      d=>derSig(secp.sign(d,new Uint8Array(keys.privateKey)))));
    const txid=await publish(txhex);
    try{ localStorage.removeItem('gbx_offer_buy_'+hl); }catch(_e){}
    say('msg','ok',tt('claimOk')+' '+txid);
    refreshAll(); setTimeout(refreshAll,6000); setTimeout(refreshAll,20000);
  }catch(e){ say('msg','err',(e&&e.message||e)); }
}

}
