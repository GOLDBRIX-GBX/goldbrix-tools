function say(el,kind,txt){const m=$(el);m.className='msg '+kind;m.textContent=txt;m.style.display='block';}
function hideM(el){$(el).style.display='none';}
async function ready(){for(let i=0;i<40&&!window.GBXRead;i++)await new Promise(r=>setTimeout(r,100));if(window.GBXReady)try{await window.GBXReady;}catch(e){}}
async function crypto_(){for(let i=0;i<40&&!(window.GoldbrixCrypto&&window.GoldbrixCrypto.deriveKeypairFromMnemonic);i++)await new Promise(r=>setTimeout(r,100));return !!(window.GoldbrixCrypto&&window.GoldbrixCrypto.deriveKeypairFromMnemonic);}
async function publish(rawtx){
  const nodes=(window.GBX_NODES||[]).slice();
  if(!nodes.length)throw new Error('no node');
  let reason=null;
  for(const n of nodes){
    let r,body;
    try{r=await fetch(String(n).replace(/\/+$/,'')+'/broadcast',{method:'POST',cache:'no-store',headers:{'content-type':'application/json'},body:JSON.stringify({rawtx})});body=await r.json().catch(()=>null);}catch(e){continue;}
    const id=body&&(body.txid||body.tx_hash);
    if(id){try{if(window.GoldbrixCrypto&&window.GoldbrixCrypto.spent)window.GoldbrixCrypto.spent.mark(rawtx);}catch(_e){}return id;}
    const msg=body&&(body.error||body.message);
    if(msg){reason=String(msg).replace(/\s+/g,' ').trim();break;}
  }
  throw new Error(reason||'no node accepted it');
}
let wallet=null,keys=null,pkHex='',secp=null,spkU=null,lastUsd=null,floorMicro=null;
let myAddr={B:'',A:'',S:''};
const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
async function boot(){
  await ready();
  wallet=(window.GBXSession&&window.GBXSession.activeWallet)?window.GBXSession.activeWallet():null;
  loadBook();
  if(wallet&&wallet.mnemonic&&await crypto_()){
    keys=await window.GoldbrixCrypto.deriveKeypairFromMnemonic(wallet.mnemonic);
    pkHex=hex(new Uint8Array(keys.publicKey));
    secp=(await import('/vendor/secp256k1.mjs')).default;
    const hm=await import('/vendor/gbx-h160.mjs');
    const h=hm.ripemd160(hm.sha256(new Uint8Array(keys.publicKey)));
    spkU=new Uint8Array(22);spkU[1]=0x14;spkU.set(h,2);
    loadMine();
    try{
      for(let i=0;i<60&&!(window.GoldbrixMultichain&&window.GoldbrixMultichain.deriveEVM);i++)await new Promise(r=>setTimeout(r,200));
      if(!(window.GoldbrixMultichain&&window.GoldbrixMultichain.deriveEVM))throw new Error('multichain module not loaded');
      const evm=await window.GoldbrixMultichain.deriveEVM(wallet.mnemonic);
      const sol=await window.GoldbrixMultichain.deriveSOL(wallet.mnemonic);
      myAddr.B=evm.address; myAddr.A=evm.address; myAddr.S=sol.address;
      fillAddr();
    }catch(_e){ say('msg','err','autofill: '+(_e&&_e.message||_e)); }
  }else{
    if(!wallet||!wallet.mnemonic) say('msg','info','wallet locked - no autofill');
  }
}
async function marketFloor(){
  try{const st=await window.GBXRead.json('/api/gbx/stats');
    if(st&&st.last_price_usd!=null){lastUsd=Number(st.last_price_usd);floorMicro=Math.round(lastUsd*1e6*0.99);return;}
  }catch(e){}
  lastUsd=null;floorMicro=null;
}
function paintPrices(){
  $('vMkt').textContent = lastUsd!=null ? ('$'+lastUsd.toFixed(4)) : '—';
  $('vMin').textContent = floorMicro!=null ? ('$'+(floorMicro/1e6).toFixed(4)) : '—';
}
function offerCard(o,mine){
  const gbx=(Number(o.value_sat)/1e8).toLocaleString('en-US',{maximumFractionDigits:4});
  const usd=(Number(o.price_micro)/1e6).toFixed(4);
  const ch=o.chain==='B'?'Base':(o.chain==='A'?'Arbitrum':'Solana');
  const st=o.spent?tt('spent'):tt('open');
  return '<div class="card'+(mine?' mine':'')+'" data-tx="'+o.txid+'" data-nonce="'+o.nonce+'" data-spk="'+o.spk+'" data-vout="'+o.vout+'" data-val="'+o.value_sat+'">'
   +'<div class="row"><span class="val amt">'+gbx+' GBX</span><span class="val price">$'+usd+'</span></div>'
   +'<div class="row"><span class="lab chain'+o.chain+'">'+ch+'</span><span class="lab">'+(mine?st:'')+'</span></div>'
   +(mine&&!o.spent?'<button class="btn red btnCancel">'+tt('cancel')+'</button>':'')
   +'</div>';
}
async function loadBook(){
  await marketFloor();
  if(floorMicro!=null){$('floorCard').style.display='block';$('vFloor').textContent='$'+(floorMicro/1e6).toFixed(4);}
  paintPrices();
  try{
    const j=await window.GBXRead.json('/api/offers');
    const list=(j&&j.offers)||[];
    const el=$('bookList');
    const html=list.length?list.map(o=>offerCard(o,false)).join('')+'<div class="empty">'+tt('buyNote')+'</div>':'<div class="empty">'+tt('empty')+'</div>';
    if(el.dataset.h!==html){el.innerHTML=html;el.dataset.h=html;}
  }catch(e){}
}
async function loadMine(){
  if(!pkHex)return;
  try{
    const j=await window.GBXRead.json('/api/offers/'+pkHex);
    const list=(j&&j.offers)||[];
    const el=$('mineList');
    const html=list.length?list.map(o=>offerCard(o,true)).join(''):'<div class="empty">'+tt('mineEmpty')+'</div>';
    if(el.dataset.h!==html){el.innerHTML=html;el.dataset.h=html;
      el.querySelectorAll('.btnCancel').forEach(b=>b.addEventListener('click',onCancel));}
  }catch(e){}
}
function validAddr(chain,a){
  a=(a||'').trim();
  if(chain==='S')return /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a);
  return /^0x[0-9a-fA-F]{40}$/.test(a);
}
function addrBytes(chain,a){
  if(chain!=='S')return C.unhex(a.trim().replace(/^0x/,''));
  const A='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  let n=0n;for(const c of a.trim())n=n*58n+BigInt(A.indexOf(c));
  let b=[];while(n>0n){b.unshift(Number(n&255n));n>>=8n;}
  for(const c of a.trim()){if(c==='1')b.unshift(0);else break;}
  const u=new Uint8Array(b);
  if(u.length!==32)throw new Error('sol addr len');
  return u;
}
$('goSell').addEventListener('click',async()=>{
  hideM('msgS');
  if(!wallet||!wallet.mnemonic||!keys){say('msgS','err',tt('locked'));setTimeout(()=>{location.href='/v3/unlock.html?next='+encodeURIComponent('/v3/offers.html');},1200);return;}
  const amtF=parseFloat(($('inAmt').value||'0').replace(',','.'));
  const priceF=parseFloat(($('inPrice').value||'0').replace(',','.'));
  const chain=$('inChain').value;const addr=$('inAddr').value;
  if(!(amtF>0)){say('msgS','err',tt('badAmt'));return;}
  if(!(priceF>0)){say('msgS','err',tt('badPrice'));return;}
  if(!validAddr(chain,addr)){say('msgS','err',tt('badAddr'));return;}
  await marketFloor();
  if(floorMicro==null){say('msgS','err',tt('noPrice'));return;}
  const priceMicro=Math.round(priceF*1e6);
  if(priceMicro<floorMicro){say('msgS','err',tt('underFloor')+' ($'+(floorMicro/1e6).toFixed(4)+')');return;}
  $('goSell').disabled=true;say('msgS','info',tt('reading'));
  try{
    const u=await window.GBXRead.json('/api/utxos/'+wallet.address+'?limit=1000',{timeout:45000});
    const utxos=(u.unspents||[]).filter(x=>x.spendable!==false).map(x=>({txid:x.txid,vout:x.vout,value8:Math.round(x.amount*1e8)})).sort((a,b)=>b.value8-a.value8);
    say('msgS','info',tt('working'));
    const built=await F.buildOfferTx({chain,priceMicro:BigInt(priceMicro),usdcAddr:addrBytes(chain,addr),gbxSat:BigInt(Math.round(amtF*1e8)),utxos,pkU:new Uint8Array(keys.publicKey),p2wpkhSpkOf:()=>spkU});
    const inputs=built.inputs.map(x=>({...x,kind:'p2wpkh'}));
    const derSig=c=>{const tr=x=>{let i=0;while(i<31&&x[i]===0)i++;let v=x.subarray(i);if(v[0]&0x80)v=Uint8Array.of(0,...v);return v;};const r=tr(c.subarray(0,32)),s=tr(c.subarray(32,64));return Uint8Array.of(0x30,4+r.length+s.length,0x02,r.length,...r,0x02,s.length,...s);};
    const sign=d=>derSig(secp.sign(d,new Uint8Array(keys.privateKey)));
    const bytes=F.buildCurveTx(inputs,built.outs,new Uint8Array(keys.publicKey),sign);
    const txid=await publish(C.hex(bytes));
    say('msgS','ok',tt('sent')+' '+txid);
    $('inAmt').value='';$('inPrice').value='';
    setTimeout(()=>{loadBook();loadMine();},6000);
  }catch(e){say('msgS','err',tt('failed')+' '+(e&&e.message||e));}
  $('goSell').disabled=false;
});
async function onCancel(ev){
  const card=ev.target.closest('.card');
  hideM('msg');
  try{
    say('msg','info',tt('reading'));
    const u=await window.GBXRead.json('/api/utxos/'+wallet.address+'?limit=1000',{timeout:45000});
    const utxos=(u.unspents||[]).filter(x=>x.spendable!==false).map(x=>({txid:x.txid,vout:x.vout,value8:Math.round(x.amount*1e8)})).sort((a,b)=>b.value8-a.value8);
    say('msg','info',tt('working'));
    const built=await F.buildOfferCancelTx({offer:{nonceHex:card.dataset.nonce,spk:card.dataset.spk,txid:card.dataset.tx,vout:Number(card.dataset.vout),value8:Number(card.dataset.val)},utxos,pkU:new Uint8Array(keys.publicKey),p2wpkhSpkOf:()=>spkU});
    const ws=C.unhex(built.offerWsHex);
    const inputs=built.inputs.map((x,i)=>i===0?{...x,kind:'token',ws}:{...x,kind:'p2wpkh'});
    const derSig=c=>{const tr=x=>{let i=0;while(i<31&&x[i]===0)i++;let v=x.subarray(i);if(v[0]&0x80)v=Uint8Array.of(0,...v);return v;};const r=tr(c.subarray(0,32)),s=tr(c.subarray(32,64));return Uint8Array.of(0x30,4+r.length+s.length,0x02,r.length,...r,0x02,s.length,...s);};
    const sign=d=>derSig(secp.sign(d,new Uint8Array(keys.privateKey)));
    const bytes=F.buildCurveTx(inputs,built.outs,new Uint8Array(keys.publicKey),sign);
    const txid=await publish(C.hex(bytes));
    say('msg','ok',tt('cancelSent')+' '+txid);
    setTimeout(()=>{loadBook();loadMine();},6000);
  }catch(e){say('msg','err',tt('failed')+' '+(e&&e.message||e));}
}
function showTab(which){
  $('vBook').style.display=which==='book'?'':'none';
  $('vSell').style.display=which==='sell'?'':'none';
  $('vMine').style.display=which==='mine'?'':'none';
  $('tabBook').classList.toggle('on',which==='book');
  $('tabSell').classList.toggle('on',which==='sell');
  $('tabMine').classList.toggle('on',which==='mine');
}
function fillAddr(){
  const ch=$('inChain').value;
  $('inAddr').placeholder = ch==='S' ? 'Solana address' : '0x…';
  if(myAddr[ch] && !$('inAddr').dataset.userEdited) $('inAddr').value=myAddr[ch];
}
$('inChain').addEventListener('change',fillAddr);
$('inAddr').addEventListener('input',()=>{$('inAddr').dataset.userEdited='1';});
$('tabBook').addEventListener('click',()=>{showTab('book');loadBook();});
$('tabSell').addEventListener('click',()=>showTab('sell'));
$('tabMine').addEventListener('click',()=>{showTab('mine');loadMine();});
setInterval(()=>{if($('vBook').style.display!=='none')loadBook();},30000);
setInterval(async()=>{if($('vSell').style.display!=='none'){await marketFloor();paintPrices();}},15000);
$('tabSell').addEventListener('click',async()=>{await marketFloor();paintPrices();});
boot();
window.addEventListener('pageshow',e=>{if(e.persisted)location.reload();});
</script>
