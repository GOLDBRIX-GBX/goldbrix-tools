          +'<span class="dot '+L.cls+'">'+L.ic+'</span>'
          +'<span class="hn"><span class="at '+(L.s==='pos'?'pos':'neg')+'">'+L.l+' GBX</span>'
          +'<span class="hs"><span class="'+L.s+'">'+L.sign+N(g)+' GBX</span></span></span>'
          +'<span class="hr"><span class="hq">'+ago(o.height)+'</span></span></a>';
      }
      var tick=esc(o.ticker||o.coin_id.slice(0,6)),lbl,cls,ic,line;
      if(o.op==='B'||o.op==='P'){lbl=tt('bought');cls='dotB';ic='↙';line='<span class="pos">+'+K(Number(o.tokens))+' '+tick+'</span> · <span class="neg">−'+gbx(o.amount)+'</span>';}
      else if(o.op==='S'||o.op==='Q'){lbl=tt('sold');cls='dotS';ic='↗';line='<span class="neg">−'+K(Number(o.amount))+' '+tick+'</span> · <span class="pos">+'+gbx(o.tokens)+'</span>';}
      else if(o.op==='C'){lbl=tt('created');cls='dotO';ic='✦';line='<span class="pos">+'+K(Number(o.tokens))+' '+tick+'</span> · <span class="neg">−'+gbx(o.amount)+'</span>';}
      else if(o.op==='G'){lbl=tt('grad');cls='dotO';ic='◆';line=gbx(o.amount);}
      else{lbl=tt('refund');cls='dotO';ic='↺';line=gbx(o.amount);}
      return '<a class="h" style="text-decoration:none;color:inherit" href="/v3/coin-x.html?coin='+o.coin_id+'">'
        +'<span class="dot '+cls+'">'+ic+'</span>'
        +'<span class="hn"><span class="at '+(cls==='dotB'?'pos':(cls==='dotS'?'neg':'gold'))+'">'+lbl+' $'+tick+'</span>'
        +'<span class="hs">'+line+'</span></span>'
        +'<span class="hr"><span class="hq">'+ago(o.height)+'</span></span></a>';
    }).join('');}else ol.textContent=tt('none');
}
go();

  if(a&&a!==pk)location.reload();};
})();
