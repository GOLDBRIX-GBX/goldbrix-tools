<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c1610">
<title>Leaderboard · GoldBrix</title>
<link rel="icon" href="/assets/coin/gbx-coin-32.png">
<link rel="stylesheet" href="/v3/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg-primary)}
body{color:var(--text-primary);font-family:'JetBrains Mono',ui-monospace,monospace;padding:14px 12px 90px;}
.sect{color:var(--text-muted);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.tab{background:var(--bg-input);border:1px solid var(--border);border-radius:10px;color:var(--text-muted);padding:10px 4px;font-size:.72rem;font-weight:700;letter-spacing:.06em;cursor:pointer;font-family:inherit;touch-action:manipulation;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{border-color:var(--gold);color:var(--gold)}
.per{display:flex;gap:6px;margin-bottom:12px}
.pbtn{flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text-muted);padding:8px 0;font-size:.7rem;font-weight:700;letter-spacing:.08em;cursor:pointer;font-family:inherit;touch-action:manipulation}
.pbtn.active{border-color:var(--gold);color:var(--gold)}
.row{display:flex;align-items:center;gap:10px;padding:11px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;text-decoration:none;color:var(--text-primary)}
.row.r1{background:linear-gradient(135deg,rgba(255,217,138,.14) 0%,var(--bg-input) 60%);border-color:rgba(255,217,138,.55)}
.row.r2{background:linear-gradient(135deg,rgba(220,220,220,.10) 0%,var(--bg-input) 60%);border-color:rgba(220,220,220,.45)}
.row.r3{background:linear-gradient(135deg,rgba(215,150,80,.12) 0%,var(--bg-input) 60%);border-color:rgba(215,150,80,.5)}
.rk{min-width:34px;text-align:center;font-weight:800;font-size:1rem}
.main{flex:1;min-width:0}
.m1{font-weight:700;font-size:.86rem;color:var(--gold);text-decoration:underline dotted;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m1.coin{color:var(--gold)}
.m2{font-size:.72rem;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{text-align:right;white-space:nowrap}
.v1{font-weight:800;font-size:.9rem;color:var(--text-muted);font-variant-numeric:tabular-nums}
.v1.burn{color:var(--red)}.v1.grn{color:var(--green)}
.v2{font-size:.66rem;letter-spacing:.06em;color:var(--text-muted);text-transform:uppercase;margin-top:2px}
.empty{padding:22px;text-align:center;color:var(--text-muted)}
.scan{text-align:center;font-size:.7rem;color:var(--text-muted);margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg-card);border-top:1px solid var(--border);padding:6px 2px calc(6px + env(safe-area-inset-bottom));z-index:50}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;text-decoration:none;color:var(--text-muted);font-size:9px;font-weight:700;letter-spacing:.1em;opacity:.92}
.nav a.on{color:var(--gold);opacity:1}
.nav span.ic{font-size:18px}
</style>
<script src="/i18n.js?v=121" defer></script>
<script src="/v3/gbx-read.js?v=121" defer></script>
<script src="/v3/nav-i18n.js?v=121" defer></script>
</head>
<body>
<div class="sect" id="pgTitle">Leaderboard</div>
<div class="tabs">
  <button class="tab active" data-tab="burners" id="tabB">BURNERS</button>
  <button class="tab" data-tab="traders" id="tabT">TRADERS</button>
  <button class="tab" data-tab="coins" id="tabC">COINS</button>
</div>
<div class="per" id="perBar">
  <button class="pbtn" data-p="28800">24H</button>
  <button class="pbtn" data-p="201600">7D</button>
  <button class="pbtn active" data-p="0" id="pAll">ALL TIME</button>
</div>
<div id="list"><div class="empty" id="loadMsg">Loading…</div></div>
<div class="scan" id="scanNote"></div>

<nav class="nav">
  <a href="/"><span class="ic">🏠</span><span data-t="navHome">HOME</span></a>
  <a href="/v3/wallet.html"><span class="ic">👤</span><span data-t="navWallet">WALLET</span></a>
  <a href="/v3/trade.html"><span class="ic">📊</span><span data-t="navTrade">TRADE</span></a>
  <a href="/v3/launch.html"><span class="ic">🚀</span><span data-t="navLaunch">LAUNCH</span></a>
  <a class="on" href="/v3/leaderboard.html"><span class="ic">🔥</span><span data-t="navBurns">BURNS</span></a>
  <a href="/v3/explorer.html"><span class="ic">🔍</span><span data-t="navExplorer">EXPLORER</span></a>
  <a href="/v3/settings.html"><span class="ic">⚙️</span><span data-t="navSettings">SETTINGS</span></a>
</nav>

<script>
(function(){
var L='en';try{L=(localStorage.getItem('gbx_lang')||localStorage.getItem('goldbrix_lang')||'en').slice(0,2);}catch(e){}
if(L==='ar'){try{document.documentElement.dir='rtl';}catch(e){}}
var T={
en:{title:'Leaderboard',burners:'BURNERS',traders:'TRADERS',coins:'COINS',all:'ALL TIME',nodata:'No data yet',loading:'Loading…',burned:'GBX burned',trades:'trades',bought:'bought',liq:'AMM liquidity',price:'price',scanned:'chain scanned to block'},
ro:{title:'Clasament',burners:'ARZĂTORI',traders:'TRADERI',coins:'MONEDE',all:'TOT TIMPUL',nodata:'Nicio dată încă',loading:'Se încarcă…',burned:'GBX arși',trades:'tranzacții',bought:'cumpărat',liq:'Lichiditate AMM',price:'preț',scanned:'lanț scanat până la blocul'},
de:{title:'Bestenliste',burners:'BURNER',traders:'TRADER',coins:'COINS',all:'GESAMT',nodata:'Noch keine Daten',loading:'Lädt…',burned:'GBX verbrannt',trades:'Trades',bought:'gekauft',liq:'AMM-Liquidität',price:'Preis',scanned:'Chain gelesen bis Block'},
zh:{title:'排行榜',burners:'销毁榜',traders:'交易榜',coins:'币种榜',all:'全部',nodata:'暂无数据',loading:'加载中…',burned:'已销毁 GBX',trades:'笔交易',bought:'买入',liq:'AMM 流动性',price:'价格',scanned:'链已扫描至区块'},
ar:{title:'لوحة الصدارة',burners:'الحارقون',traders:'المتداولون',coins:'العملات',all:'كل الوقت',nodata:'لا بيانات بعد',loading:'جارٍ التحميل…',burned:'GBX محروق',trades:'صفقات',bought:'شراء',liq:'سيولة AMM',price:'السعر',scanned:'تم مسح السلسلة حتى الكتلة'}};
var t=T[L]||T.en;
document.getElementById('pgTitle').textContent=t.title;
document.getElementById('tabB').textContent=t.burners;
document.getElementById('tabT').textContent=t.traders;
document.getElementById('tabC').textContent=t.coins;
document.getElementById('pAll').textContent=t.all;
document.getElementById('loadMsg').textContent=t.loading;

var tab='burners', per=0;
function $(i){return document.getElementById(i);}
function gbx(sat){var n=Number(sat)/1e8;
  if(n>=1000000)return (n/1000000).toFixed(2)+'M';
  if(n>=10000)return (n/1000).toFixed(1)+'K';
  if(n>=1000)return n.toLocaleString('en-US',{maximumFractionDigits:0});
  return n.toFixed(n>=100?0:(n>=1?2:4));}
function shortPk(pk){return pk.slice(0,6)+'…'+pk.slice(-4);}
function medal(r){return r===1?'🥇':(r===2?'🥈':(r===3?'🥉':('#'+r)));}
function rcls(r){return r<=3?(' r'+r):'';}
async function gj(p){for(var i=0;i<20&&!window.GBXRead;i++)await new Promise(function(r){setTimeout(r,100);});
  return window.GBXRead?await window.GBXRead.json(p):await (await fetch(p)).json();}

async function load(){
  var el=$('list');
  try{
    var html='';
    if(tab==='coins'){
      var j=await gj('/api/pools');
      var ps=(j&&j.pools)||[];
      ps.sort(function(a,b){return Number(b.gbx_sat)-Number(a.gbx_sat);});
      if(!ps.length){el.innerHTML='<div class="empty">'+t.nodata+'</div>';return;}
      html=ps.slice(0,50).map(function(p,i){
        var r=i+1, mu=(Number(p.price_sat)/100).toFixed(2);
        return '<a class="row'+rcls(r)+'" href="/v3/coin-x.html?coin='+p.coin_id+'">'+
          '<div class="rk">'+medal(r)+'</div>'+
          '<div class="main"><div class="m1 coin">$'+(p.ticker||'?')+'</div>'+
          '<div class="m2">'+(p.name||'')+' · '+t.price+' '+mu+' µGBX</div></div>'+
          '<div class="val"><div class="v1 grn">'+gbx(p.gbx_sat)+' GBX</div>'+
          '<div class="v2">'+t.liq+'</div></div></a>';
      }).join('');
      if(j&&j.scanned)$('scanNote').textContent=t.scanned+' '+Number(j.scanned).toLocaleString('en-US');
    } else {
      var q='/api/leaderboard?kind='+tab+(per>0?('&blocks='+per):'&blocks=0');
      var j2=await gj(q);
      var items=(j2&&j2.items)||[];
      if(!items.length){el.innerHTML='<div class="empty">'+t.nodata+'</div>';return;}
      html=items.slice(0,50).map(function(it,i){
        var r=i+1;
        var v1,v2,m2;
        if(tab==='burners'){v1='<div class="v1 burn">'+gbx(it.burned_sat)+' 🔥</div>';v2=t.burned;m2='';}
        else{v1='<div class="v1 grn">'+it.trades+'</div>';v2=t.trades;m2=t.bought+' '+gbx(it.gbx_sat)+' GBX';}
        return '<a class="row'+rcls(r)+'" href="/v3/profile-x.html?pk='+it.pk+'">'+
          '<div class="rk">'+medal(r)+'</div>'+
          '<div class="main"><div class="m1">'+shortPk(it.pk)+'</div>'+
          (m2?'<div class="m2">'+m2+'</div>':'')+'</div>'+
          '<div class="val">'+v1+'<div class="v2">'+v2+'</div></div></a>';
      }).join('');
      if(j2&&j2.scanned)$('scanNote').textContent=t.scanned+' '+Number(j2.scanned).toLocaleString('en-US');
    }
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="empty">'+t.nodata+'</div>';}
}

document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){
    tab=b.dataset.tab;
    document.querySelectorAll('.tab').forEach(function(x){x.className='tab'+(x===b?' active':'');});
    $('perBar').style.display=(tab==='coins')?'none':'flex';
    load();
  });
});
document.querySelectorAll('.pbtn').forEach(function(b){
  b.addEventListener('click',function(){
    per=Number(b.dataset.p);
    document.querySelectorAll('.pbtn').forEach(function(x){x.className='pbtn'+(x===b?' active':'');});
    load();
  });
});
window.addEventListener('pageshow',function(e){if(e.persisted)location.reload();});
load();setInterval(load,30000);
})();
</script>
<script src="/v3/gbx-autolock.js" defer></script>
<script src="/promo-banner.js?v=121" defer></script>
</body>
</html>
