<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c1610">
<title>GoldBrix - Updates</title>
<link rel="stylesheet" href="/v3/style.css?v=119">
<script src="/v3/gbx-session.js?v=119"></script>
<script src="/v3/gbx-read.js?v=119"></script>
<script src="/vendor/buffer.bundle.mjs?v=119" type="module"></script>
<script type="module">import * as B from "/vendor/buffer.bundle.mjs";window.Buffer=window.Buffer||B.Buffer||(B.default&&B.default.Buffer);</script>
<script type="module" src="/crypto-utils-v2.js?v=119"></script>
<style>
body{margin:0;background:var(--bg,#120e08);color:var(--text-primary,#FFFDF7);font-family:Inter,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:20px;color:var(--gold,#FFD98A);margin:14px 0 2px}
.sub{font-size:12px;color:#FFFDF7;opacity:.85;margin:0 0 14px}
.card{background:rgba(255,217,138,.05);border:1px solid var(--border,#3a2f1e);border-radius:14px;padding:12px;margin-bottom:10px}
.pk{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--gold,#FFD98A);word-break:break-all}
.tx{font-size:14px;line-height:1.45;margin:6px 0 4px;overflow-wrap:anywhere;white-space:pre-wrap}
.tm{font-size:10px;color:#FFFDF7;opacity:.8}
.post{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));background:#1c1610;border-top:1px solid var(--border,#3a2f1e);padding:10px 14px 10px}
.post .in{display:flex;gap:8px;max-width:560px;margin:0 auto}
textarea{flex:1;background:#120e08;border:1px solid var(--border,#3a2f1e);border-radius:10px;color:#FFFDF7;font-size:14px;padding:8px;resize:none;height:44px;font-family:inherit}
button{background:var(--gold,#FFD98A);color:#120e08;border:0;border-radius:10px;font-weight:800;padding:0 16px;font-size:14px}
button:disabled{opacity:.45}
.msg{font-size:12px;margin:6px 0;text-align:center}
.msg.err{color:var(--red,#FF6B5C)}.msg.ok{color:var(--green,#57FF9E)}
.empty{text-align:center;opacity:.85;padding:40px 0;font-size:13px}
.mine{border-color:var(--gold,#FFD98A)}
</style></head><body>
<div class="wrap">
<h1 id="tTitle"></h1><p class="sub" id="tSub"></p>
<div id="feed"><div class="empty" id="tLoad"></div></div>
</div>
<div class="post" id="postBar" style="display:none"><div>
<div class="msg" id="pMsg" style="display:none"></div>
<div class="in"><textarea id="pText" maxlength="280"></textarea><button id="pBtn"></button></div>
</div></div>
<script type="module">
const I={
en:{title:'Updates',sub:'Announcements from coin creators · signed on-chain keys · auto-delete after 24h',load:'Reading the federation…',empty:'No announcements in the last 24 hours.',post:'Post',posting:'Posting…',posted:'Published ✓',locked:'Unlock your wallet to post (creators only).',notCreator:'Only coin creators can post.',rate:'One announcement per 10 minutes.',err:'Could not publish. Try again.',net:'Federation unreachable.'},
ro:{title:'Anunțuri',sub:'Anunțuri de la creatorii de monede · chei semnate on-chain · se șterg după 24h',load:'Citesc federația…',empty:'Niciun anunț în ultimele 24 de ore.',post:'Publică',posting:'Se publică…',posted:'Publicat ✓',locked:'Deblochează portofelul ca să postezi (doar creatorii).',notCreator:'Doar creatorii de monede pot posta.',rate:'Un anunț la 10 minute.',err:'Nu s-a putut publica. Reîncearcă.',net:'Federația nu răspunde.'},
de:{title:'Ankündigungen',sub:'Ankündigungen von Coin-Erstellern · on-chain signiert · löschen sich nach 24h',load:'Föderation wird gelesen…',empty:'Keine Ankündigungen in den letzten 24 Stunden.',post:'Posten',posting:'Wird gepostet…',posted:'Veröffentlicht ✓',locked:'Wallet entsperren zum Posten (nur Ersteller).',notCreator:'Nur Coin-Ersteller können posten.',rate:'Eine Ankündigung pro 10 Minuten.',err:'Veröffentlichung fehlgeschlagen. Erneut versuchen.',net:'Föderation nicht erreichbar.'},
zh:{title:'公告',sub:'来自代币创建者的公告 · 链上密钥签名 · 24小时后自动删除',load:'正在读取联邦…',empty:'过去24小时内没有公告。',post:'发布',posting:'发布中…',posted:'已发布 ✓',locked:'解锁钱包后可发布（仅限创建者）。',notCreator:'只有代币创建者可以发布。',rate:'每10分钟一条公告。',err:'发布失败，请重试。',net:'无法连接联邦。'},
ar:{title:'الإعلانات',sub:'إعلانات من منشئي العملات · مفاتيح موقعة على السلسلة · تُحذف بعد 24 ساعة',load:'قراءة الاتحاد…',empty:'لا إعلانات في آخر 24 ساعة.',post:'نشر',posting:'جارٍ النشر…',posted:'تم النشر ✓',locked:'افتح محفظتك للنشر (المنشئون فقط).',notCreator:'فقط منشئو العملات يمكنهم النشر.',rate:'إعلان واحد كل 10 دقائق.',err:'تعذر النشر. حاول مجددًا.',net:'تعذر الوصول إلى الاتحاد.'}};
const L=localStorage.getItem('gbx_lang')||localStorage.getItem('goldbrix_lang')||'en';
const T=I[L]||I.en; if(L==='ar')document.documentElement.dir='rtl';
const $=id=>document.getElementById(id);
$('tTitle').textContent=T.title;$('tSub').textContent=T.sub;$('tLoad').textContent=T.load;$('pBtn').textContent=T.post;
const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
let wallet=null,keys=null,pkHex='',secp=null;
async function sha256(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return new Uint8Array(d);}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function ago(ts){const m=Math.floor((Date.now()-ts)/60000);if(m<1)return'now';if(m<60)return m+'m';return Math.floor(m/60)+'h';}
async function verifyRow(m){try{const dg=await sha256('GBXCHAT1|'+m.pk+'|'+m.ts+'|'+m.text);
  const b=h=>Uint8Array.from(h.match(/../g),x=>parseInt(x,16));
  return secp?secp.verify(dg,b(m.pk),b(m.sig)):true;}catch(_e){return false;}}
async function load(){
  try{
    const nodes=(window.GBX_NODES||[]).slice(0,4);
    const seen={},items=[];
    await Promise.all(nodes.map(async n=>{try{
      const base=String(n).replace(/\/api\/?$/,'');
      const r=await fetch(base+'/api/chat/recent',{cache:'no-store'});
      if(!r.ok)return;const j=await r.json();
      (j.items||[]).forEach(m=>{const k=m.pk+'|'+m.ts;if(!seen[k]){seen[k]=1;items.push(m);}});
    }catch(_e){}}));
    items.sort((a,b)=>b.ts-a.ts);
    const ok=[];for(const m of items){if(await verifyRow(m))ok.push(m);}
    const f=$('feed');
    if(!ok.length){f.innerHTML='<div class="empty">'+T.empty+'</div>';return;}
    f.innerHTML=ok.map(m=>'<div class="card'+(m.pk===pkHex?' mine':'')+'"><div class="pk">'+esc(m.pk.slice(0,16))+'…</div><div class="tx">'+esc(m.text)+'</div><div class="tm">'+ago(m.ts)+'</div></div>').join('');
  }catch(_e){$('feed').innerHTML='<div class="empty">'+T.net+'</div>';}
}
function say(cls,t){const e=$('pMsg');e.className='msg '+cls;e.textContent=t;e.style.display='block';}
async function boot(){
  secp=(await import('/vendor/secp256k1.mjs')).default;
  await load();setInterval(load,30000);
  wallet=(window.GBXSession&&window.GBXSession.activeWallet)?window.GBXSession.activeWallet():null;
  if(!(wallet&&wallet.mnemonic))return;
  for(let i=0;i<40&&!(window.GoldbrixCrypto&&window.GoldbrixCrypto.deriveKeypairFromMnemonic);i++)await new Promise(r=>setTimeout(r,100));
  if(!(window.GoldbrixCrypto&&window.GoldbrixCrypto.deriveKeypairFromMnemonic))return;
  keys=await window.GoldbrixCrypto.deriveKeypairFromMnemonic(wallet.mnemonic);
  pkHex=hex(new Uint8Array(keys.publicKey));
  $('postBar').style.display='block';
  $('pBtn').onclick=async()=>{
    const text=$('pText').value.trim();if(!text)return;
    $('pBtn').disabled=true;say('','');say('ok',T.posting);
    try{
      const ts=Date.now();
      const dg=await sha256('GBXCHAT1|'+pkHex+'|'+ts+'|'+text);
      const sig=hex(secp.sign(dg,new Uint8Array(keys.privateKey)));
      const nodes=(window.GBX_NODES||[]).slice(0,4);let okAny=false,errC='';
      await Promise.all(nodes.map(async n=>{try{
        const base=String(n).replace(/\/api\/?$/,'');
        const r=await fetch(base+'/api/chat',{method:'POST',body:JSON.stringify({pk:pkHex,ts,text,sig})});
        const j=await r.json();if(j.ok)okAny=true;else errC=errC||j.error;
      }catch(_e){}}));
      if(okAny){say('ok',T.posted);$('pText').value='';await load();}
      else say('err',errC==='not_creator'?T.notCreator:errC==='rate_limited'?T.rate:T.err);
    }catch(_e){say('err',T.err);}
    $('pBtn').disabled=false;
  };
}
boot();
</script>
<script src="/v3/nav-i18n.js?v=119" defer></script>
<script src="/v3/gbx-autolock.js" defer></script>
</body></html>
