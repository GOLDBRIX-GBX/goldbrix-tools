<!doctype html><html><head><meta charset="utf-8">
<title>GoldBrix</title>
<script src="/v3/gbx-session.js?v=120"></script>
<script type="module" src="/crypto-utils-v2.js?v=120"></script>
<script>
/* The wallet now lives on the account page: an account is a key, and the
   page shows what that key holds. Older links keep working through here. */
(function(){
(async function(){
  var next='/v3/profile-x.html';
  try{
    var st=(window.GBXSession&&window.GBXSession.status)?window.GBXSession.status():'none';
    for(var i=0;i<20&&st==='retry';i++){await new Promise(function(r){setTimeout(r,150);});st=window.GBXSession.status();}
    if(st!=='ok'){location.replace('/v3/unlock.html?next='+encodeURIComponent(next));return;}
    var w=window.GBXSession.activeWallet();
    if(w&&w.mnemonic){
      for(var j=0;j<40&&!(window.GoldbrixCrypto&&window.GoldbrixCrypto.deriveKeypairFromMnemonic);j++)
        await new Promise(function(r){setTimeout(r,100);});
      if(window.GoldbrixCrypto&&window.GoldbrixCrypto.deriveKeypairFromMnemonic){
        var kp=await window.GoldbrixCrypto.deriveKeypairFromMnemonic(w.mnemonic);
        var pk=Array.from(new Uint8Array(kp.publicKey),function(x){return x.toString(16).padStart(2,'0');}).join('');
        try{localStorage.setItem('gbx_my_pk',pk);}catch(e){}
        location.replace(next+'?pk='+pk);return;
      }
    }
  }catch(e){}
  location.replace(next);
})();
})();
</script></head><body></body></html>
