<!doctype html><html><head><meta charset="utf-8">
<title>GoldBrix</title>
<script src="/v3/gbx-session.js?v=119"></script>
<script type="module" src="/crypto-utils-v2.js?v=124"></script>
<script>
/* This page moved: an account is identified by its public key.
   An address cannot be turned back into a key, so we only send the
   viewer to the account page when the address is the one unlocked
   on this device; otherwise the explorer is the honest destination. */
(function(){
function addr(){var qs=location.search,h=(location.hash||'').indexOf('?');
  if(h>=0)qs='?'+location.hash.slice(h+1);
  var p=new URLSearchParams(qs);
  return p.get('addr')||p.get('ro_addr')||p.get('viewAddr')||'';}
(async function(){
  var a=addr();
  try{
    var w=window.GBXSession&&window.GBXSession.activeWallet?window.GBXSession.activeWallet():null;
    if(w&&w.address&&(!a||a===w.address)){
      for(var i=0;i<40&&!(window.GoldbrixCrypto&&window.GoldbrixCrypto.deriveKeypairFromMnemonic);i++)
        await new Promise(function(r){setTimeout(r,100);});
      if(w.mnemonic&&window.GoldbrixCrypto&&window.GoldbrixCrypto.deriveKeypairFromMnemonic){
        var kp=await window.GoldbrixCrypto.deriveKeypairFromMnemonic(w.mnemonic);
        var pk=Array.from(new Uint8Array(kp.publicKey),function(x){return x.toString(16).padStart(2,'0');}).join('');
        location.replace('/v3/profile-x.html?pk='+pk);return;
      }
    }
  }catch(e){}
  var mine='';try{mine=localStorage.getItem('gbx_my_pk')||'';}catch(e){}
  if(!a&&mine){location.replace('/v3/profile-x.html?pk='+mine);return;}
  location.replace(a?('/v3/explorer.html?q='+encodeURIComponent(a)):'/v3/wallet.html');
})();
})();
</script></head><body></body></html>
